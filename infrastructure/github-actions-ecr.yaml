AWSTemplateFormatVersion: "2010-09-09"
Description: Short-lived GitHub Actions access for publishing YallaQueue images to private ECR repositories.

Parameters:
  GitHubOwner:
    Type: String
    Default: Yusuf-Karanib
  GitHubRepository:
    Type: String
    Default: YallaQueue
  GitHubOwnerId:
    Type: String
    Default: "240980687"
    AllowedPattern: "[0-9]+"
  GitHubRepositoryId:
    Type: String
    Default: "1309140317"
    AllowedPattern: "[0-9]+"
  GitHubBranch:
    Type: String
    Default: main
  WebRepositoryName:
    Type: String
    Default: yallaqueue-production-web
  WorkerRepositoryName:
    Type: String
    Default: yallaqueue-production-worker
  RoleName:
    Type: String
    Default: yallaqueue-github-actions-ecr
  CreateGitHubOidcProvider:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Set true only when this AWS account does not already have GitHub's OIDC provider.
  ExistingGitHubOidcProviderArn:
    Type: String
    Default: ""
    Description: Required when CreateGitHubOidcProvider is false.

Conditions:
  ShouldCreateGitHubOidcProvider: !Equals
    - !Ref CreateGitHubOidcProvider
    - "true"

Rules:
  ExistingProviderArnRequiredWhenNotCreating:
    RuleCondition: !Equals
      - !Ref CreateGitHubOidcProvider
      - "false"
    Assertions:
      - Assert: !Not
          - !Equals
            - !Ref ExistingGitHubOidcProviderArn
            - ""
        AssertDescription: ExistingGitHubOidcProviderArn is required when CreateGitHubOidcProvider is false.

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateGitHubOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  GitHubActionsEcrRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - ShouldCreateGitHubOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepository}@${GitHubRepositoryId}:ref:refs/heads/${GitHubBranch}"
      Policies:
        - PolicyName: PublishYallaQueueImages
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: GetEcrLoginToken
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: PublishImages
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                Resource:
                  - !Sub "arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${WebRepositoryName}"
                  - !Sub "arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${WorkerRepositoryName}"

Outputs:
  GitHubActionsEcrRoleArn:
    Value: !GetAtt GitHubActionsEcrRole.Arn
  GitHubOidcProviderArn:
    Description: GitHub OIDC provider created by or supplied to this stack.
    Value: !If
      - ShouldCreateGitHubOidcProvider
      - !Ref GitHubOidcProvider
      - !Ref ExistingGitHubOidcProviderArn
